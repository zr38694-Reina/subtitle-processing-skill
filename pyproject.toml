[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "subtitle-processor"
version = "1.0.0"
description = "中文课程字幕加工流水线 — 清理语气词、修正ASR错误、合并断句、生成课程概要"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"

[project.scripts]
subtitle-process = "subtitle_processor.cli:main"
subtitle-clean = "subtitle_processor.cli:main"

[tool.setuptools.packages.find]
include = ["subtitle_processor*"]
